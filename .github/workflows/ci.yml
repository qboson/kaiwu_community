name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  build:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # 多版本 CI 矩阵：Python 3.10 / 3.12 / 3.14 各一套作业，取该环境默认解析出的依赖组合。
    # numpy 的逐版本验证不进这里——它在 .github/workflows/numpy-matrix.yml 里手动触发，
    # 与 enterprise 的 numpy_matrix（when: manual）取同样的取舍，避免占满 CI 配额。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devel.txt

      - name: Show resolved versions
        run: |
          python -c "import sys, numpy; print('python', sys.version.split()[0], '| numpy', numpy.__version__)"

      - name: Pylint
        # lint 结果与 Python 版本无关，只在 3.10 上跑一次，省两份 CI 时间
        if: matrix.python-version == '3.10'
        run: |
          pylint src/kaiwu

      - name: Doctest (docs-test)
        run: |
          pytest --doctest-modules -o doctest_optionflags=NORMALIZE_WHITESPACE src/kaiwu

      - name: Pytest + Coverage
        run: |
          coverage run --source=src/kaiwu -m pytest tests
          coverage report
