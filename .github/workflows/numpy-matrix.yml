name: NumPy Matrix

# numpy 版本矩阵：覆盖设计，不做笛卡尔积——每个 numpy 版本只在一个 Python 上测
# 一次（受 wheel 可用性约束：哪个 Python 有 cp3XX wheel 才能放哪个），每个 Python
# 至少分到一个版本。numpy 的行为差异主要取决于 numpy 版本本身，Python × numpy 的
# 交互由 ci.yml 的常规作业（每个 Python × 默认 numpy）兜底。
#
# 因此基础作业数 = numpy minor 系列数（8），而不是 3 × 7 = 21 个组合。
# 例外一：1.x → 2.2 这一段跨了 numpy 1.x → 2.x 的 ABI 与行为大改（标量 repr、copy
#   语义、废弃别名移除），在 3.10 上逐个完整测，不做「上下界通过 ⇒ 中间通过」的推断。
# 例外二：3.12 的区间最宽（1.26 → 2.5）且是主开发环境，额外补它的两个区间端点，
#   使每个 Python 的下界与上界都有验证（1.26.4 与 2.5.3 因此各测两次）。合计 10 个。
#
# 手动触发（对应 enterprise .gitlab-ci.yml 的 numpy_matrix `when: manual`）：
# 10 个组合各自完整装包 + 跑测试，耗时较长，不占用每次 push / PR 的 CI 配额。
# 每个组合跑在一个独立 runner 上，装包互不干扰，可并发。
on:
  workflow_dispatch:

jobs:
  numpy-matrix:
    name: Python ${{ matrix.python-version }} / numpy ${{ matrix.numpy }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.x → 2.2 这一段跨了 numpy 1.x → 2.x 的 ABI 与行为大改（标量 repr、
          # copy 语义、废弃别名移除），在 3.10 上逐个完整测，不做
          # 「上下界通过 ⇒ 中间通过」的推断
          - { python-version: "3.10", numpy: "1.26.4" }
          - { python-version: "3.10", numpy: "2.0.2" }
          - { python-version: "3.10", numpy: "2.1.3" }
          - { python-version: "3.10", numpy: "2.2.6" }
          # 3.12 的区间最宽（1.26 → 2.5），完整跨 1.x → 2.x 断裂，且是主开发环境：
          # 两个区间端点各测一次，2.3 / 2.4 两个中间版本放在这里分摊
          - { python-version: "3.12", numpy: "1.26.4" }
          - { python-version: "3.12", numpy: "2.3.5" }
          - { python-version: "3.12", numpy: "2.4.6" }
          - { python-version: "3.12", numpy: "2.5.3" }
          # 2.3.2 是 3.14 声明的下界（低于它无 cp314 wheel），单列一条以验证声明
          - { python-version: "3.14", numpy: "2.3.2" }
          - { python-version: "3.14", numpy: "2.5.3" }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devel.txt

      # 显式钉版而不是 constraints 文件：约束只能收窄区间，无法把已装的旧版本升到上界
      - name: Pin numpy ${{ matrix.numpy }}
        run: pip install "numpy==${{ matrix.numpy }}"

      - name: Verify resolved version
        run: |
          python -c "import numpy; v = numpy.__version__; print('numpy', v); assert v == '${{ matrix.numpy }}', v"

      - name: Pytest
        run: pytest tests -q

      - name: Doctest
        run: pytest --doctest-modules -o doctest_optionflags=NORMALIZE_WHITESPACE src/kaiwu -q
